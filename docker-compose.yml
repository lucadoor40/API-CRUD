version: "3.9"

services:
  web:
    build: .
    image: gestao-vulnerabilidades:latest
    container_name: gestao-vulnerabilidades
    ports:
      - "3333:5000"
    volumes:
      - dados_app:/app/data
    environment:
      - DATA_DIR=/app/data
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  dados_app:
    name: gestao_vulnerabilidades_dados